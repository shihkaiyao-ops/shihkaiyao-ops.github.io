<h1>sky-mail</h1>
<p>sky-mail 是個人自用的收信小工具，只給帳號擁有者本人使用，不對外提供服務。</p>
<p>它用 Gmail 的「唯讀」權限讀取本人信箱的新信，在本人自己的主機上整理成摘要。不寄信、不刪信、不改信。</p>
